name: release

on:
  push:
    tags: ['v*']
  # Rebuild and attach binaries to an existing tag: Actions → release → Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.3.12'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config

      # The tag must match the version in frontend/package.json.
      - name: Check version
        run: |
          pkg_version=$(node -p "require('./frontend/package.json').version")
          if [ "v$pkg_version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Test
        run: make test

      - name: Build
        run: make build VERSION="${TAG#v}"

      # Self-contained build for the Steam Deck (SteamOS cannot install GTK 4
      # or WebKitGTK 6.0) and other distributions without these libraries.
      - name: Build AppImage
        run: make appimage VERSION="${TAG#v}"

      - name: Package
        run: |
          name="xodus-nexus-wails-${TAG}-linux-amd64"
          mkdir "$name"
          cp build/bin/xodus-nexus-wails LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          appimage="xodus-nexus-wails-${TAG}-x86_64.AppImage"
          mv build/bin/xodus-nexus-wails-x86_64.AppImage "$appimage"
          sha256sum "$appimage" > "$appimage.sha256"

      # Attach to the release if it was already created by hand, otherwise create it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="xodus-nexus-wails-*.tar.gz* xodus-nexus-wails-*.AppImage*"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files \
              --title "$TAG" --generate-notes
          fi
